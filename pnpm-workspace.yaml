ignoreWorkspaceRootCheck: true
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

packages:
  - docs
  - packages/*
  - shared

overrides:
  twoslash-eslint: 'catalog:docs'
  vite: 'catalog:dev'
  vitest: 'catalog:test'
  vue: 'catalog:docs'
  vue-tsc: 'catalog:dev'

catalogs:
  build:
    '@codecov/rollup-plugin': ^2.0.1
    tsdown: ^0.22.14
  dev:
    '@antfu/eslint-config': ^9.3.0
    '@antfu/eslint-define-config': 1.23.0-2
    '@antfu/utils': ^9.3.0
    '@eslint/core': ^1.2.1
    '@eslint/css': ^1.4.0
    '@eslint/markdown': ^8.0.3
    '@eslint/plugin-kit': ^0.7.2
    '@types/estree': ^1.0.9
    '@types/node': ^26.2.0
    '@types/picomatch': ^4.0.3
    '@typescript-eslint/parser': ^8.67.0
    '@typescript-eslint/utils': ^8.67.0
    bumpp: ^12.2.1
    change-case: ^5.4.4
    diff: ^9.0.0
    escape-string-regexp: ^5.0.0
    eslint: ^10.9.0
    eslint-plugin-eslint-plugin: ^7.6.2
    eslint-plugin-format: ^2.0.1
    gray-matter: ^4.0.3
    jiti: ^2.7.0
    json-schema-to-typescript-lite: ^15.0.0
    jsonc-eslint-parser: ^3.3.0
    nano-staged: ^1.0.2
    ohash: ^2.0.12
    oxfmt: ^0.64.0
    oxlint: 1.55.0
    simple-git: ^3.36.0
    simple-git-hooks: ^2.13.1
    taze: ^21.1.0
    tinyexec: ^1.3.0
    tinyglobby: ^0.2.17
    tsx: ^4.23.12
    typescript: ^6.0.3
    verkit: ^0.4.0
    vite: ^8.2.2
    vue-tsc: ^3.3.11
  docs:
    '@iconify-json/carbon': ^1.2.25
    '@iconify-json/ri': ^1.2.10
    '@rolldown/pluginutils': ^1.0.1
    '@shikijs/transformers': ^4.4.3
    '@shikijs/twoslash': ^4.4.3
    '@shikijs/vitepress-twoslash': ^4.4.3
    '@types/markdown-it-container': ^4.0.0
    '@vueuse/core': ^14.4.0
    conventional-commits-parser: ^7.1.2
    fuse.js: ^7.5.0
    markdown-it-container: ^4.0.0
    shiki: ^4.4.3
    twoslash: ^0.3.9
    twoslash-eslint: ^0.3.9
    unocss: ^66.8.1
    unplugin-vue-components: ^32.1.0
    vitepress: ^2.0.0-alpha.19
    vue: ^3.5.41
  prod:
    '@eslint-community/eslint-utils': ^4.10.1
    '@typescript-eslint/types': ^8.67.0
    '@typescript-eslint/visitor-keys': ^8.67.0
    espree: ^11.2.0
    picomatch: ^4.0.5
  test:
    '@babel/eslint-parser': ^7.29.7
    '@babel/plugin-syntax-decorators': ^7.29.7

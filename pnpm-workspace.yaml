ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - '@docsearch/*'

shellEmulator: true

packages:
  - docs
  - packages/*
  - shared

overrides:
  twoslash-eslint: 'catalog:docs'
  vite: 'catalog:dev'
  vitest: 'catalog:test'
  vue: 'catalog:docs'
  vue-tsc: 'catalog:dev'

allowBuilds:
  esbuild: false
  simple-git-hooks: true

catalogs:
  build:
    '@codecov/rollup-plugin': ^2.0.1
    tsdown: ^0.23.7
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/eslint-define-config': 1.23.0-2
    '@antfu/utils': ^9.3.0
    '@eslint/core': ^1.2.1
    '@eslint/css': ^2.0.1
    '@eslint/markdown': ^8.0.3
    '@eslint/plugin-kit': ^0.7.3
    '@types/estree': ^1.0.10
    '@types/node': ^26.6.6
    '@types/picomatch': ^4.0.3
    '@typescript-eslint/parser': ^8.72.2
    '@typescript-eslint/utils': ^8.72.2
    bumpp: ^12.3.0
    change-case: ^5.4.4
    diff: ^9.0.0
    escape-string-regexp: ^5.0.0
    eslint: ^10.15.0
    eslint-plugin-eslint-plugin: ^7.6.2
    eslint-plugin-format: ^2.0.1
    gray-matter: ^4.0.3
    jiti: ^2.7.0
    json-schema-to-typescript-lite: ^15.0.0
    jsonc-eslint-parser: ^3.3.0
    nano-staged: ^1.0.2
    ohash: ^2.0.12
    oxfmt: ^0.78.0
    oxlint: 1.93.0
    simple-git: ^4.0.2
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    tinyexec: ^1.3.1
    tinyglobby: ^0.2.17
    tsx: ^4.23.15
    typescript: ^6.0.3
    verkit: ^0.5.0
    vite: ^8.3.8
    vue-tsc: ^3.3.14
  docs:
    '@iconify-json/carbon': ^1.2.30
    '@iconify-json/ri': ^1.2.10
    '@rolldown/pluginutils': ^1.1.1
    '@shikijs/transformers': ^4.6.0
    '@shikijs/twoslash': ^4.6.0
    '@shikijs/vitepress-twoslash': ^4.6.0
    '@types/markdown-it-container': ^4.0.1
    '@vueuse/core': ^15.0.0
    conventional-commits-parser: ^7.1.4
    fuse.js: ^7.5.0
    markdown-it-container: ^4.0.0
    shiki: ^4.6.0
    twoslash: ^0.3.9
    twoslash-eslint: ^0.3.9
    unocss: ^66.13.0
    unplugin-vue-components: ^32.1.0
    vitepress: ^2.0.0-alpha.21
    vue: ^3.5.45
  prod:
    '@eslint-community/eslint-utils': ^4.10.1
    '@typescript-eslint/types': ^8.72.2
    '@typescript-eslint/visitor-keys': ^8.72.2
    espree: ^11.2.0
    picomatch: ^4.0.7
  test:
    '@babel/eslint-parser': ^7.29.7
    '@babel/plugin-syntax-decorators': ^7.29.7
    '@babel/plugin-syntax-do-expressions': ^7.29.7
    '@babel/plugin-syntax-function-bind': ^7.29.7
    '@babel/preset-react': ^7.29.7
    '@vitest/coverage-v8': ^4.1.12
    '@vitest/ui': ^4.1.12
    eslint-vitest-rule-tester: ^3.2.0
    vitest: ^4.1.12
    vue-eslint-parser: ^10.4.2
